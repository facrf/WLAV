name: Publicar imagem no GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: facrf/wlav

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: Testar e publicar
    # Gitea e Forgejo expõem github.server_url por compatibilidade. Esta trava
    # impede que um espelho execute o job mesmo se ele ler .github/workflows.
    if: ${{ github.server_url == 'https://github.com' && github.repository == 'facrf/WLAV' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Os testes que dependem do banco rodam contra um PostgreSQL descartável.
    # Sem `WLAV_TEST_DATABASE_URL` eles são pulados, e o schema, a paginação por
    # cursor, a busca FTS e o backup portátil ficariam sem cobertura.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      WLAV_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wlav_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -e '.[dev]'

      - name: Validar o projeto
        run: |
          ruff check .
          pytest -q

      - name: Preparar emulação multi-arquitetura
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Autenticar no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados OCI
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/facrf/WLAV
            org.opencontainers.image.licenses=MIT

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
