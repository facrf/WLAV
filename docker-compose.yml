name: wlav

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wlav}
      POSTGRES_USER: ${POSTGRES_USER:-wlav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wlav-local-only}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-wlav.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://wlav:wlav-local-only@db:5432/wlav}
      MEDIA_ROOT: /var/whatsapp_media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PAGE_SIZE: ${API_PAGE_SIZE:-50}
      API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:-200}
      IMPORT_ROOT: /var/wlav_imports
      TMPDIR: /var/wlav_imports
      UPLOAD_MAX_GB: ${UPLOAD_MAX_GB:-100}
      THUMBNAIL_MAX_SIZE: ${THUMBNAIL_MAX_SIZE:-480}
      TZ: America/Sao_Paulo
    ports:
      - "${WLAV_BIND_ADDRESS:-0.0.0.0}:${WLAV_PORT:-21001}:21001"
    volumes:
      - whatsapp_media:/var/whatsapp_media
      - import_spool:/var/wlav_imports
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:21001/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

  ingestor:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    profiles: ["tools"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://wlav:wlav-local-only@db:5432/wlav}
      MEDIA_ROOT: /var/whatsapp_media
      TZ: America/Sao_Paulo
    entrypoint: ["python", "-m", "ingestor.main"]
    command: ["--help"]
    user: "${WLAV_UID:-1000}:${WLAV_GID:-1000}"
    volumes:
      - whatsapp_media:/var/whatsapp_media
      - ./imports:/imports:ro
      - ./exports:/exports
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  backup:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://wlav:wlav-local-only@db:5432/wlav}
      MEDIA_ROOT: /var/whatsapp_media
      WLAV_BACKUP_PASSWORD_FILE: /run/secrets/backup-password.txt
      TZ: America/Sao_Paulo
    entrypoint: ["python", "-m", "ingestor.main"]
    command:
      - backup-loop
      - --output-dir
      - /exports
      - --interval-hours
      - "${BACKUP_INTERVAL_HOURS:-24}"
      - --retention-days
      - "${BACKUP_RETENTION_DAYS:-30}"
      - --encrypt
    user: "${WLAV_UID:-1000}:${WLAV_GID:-1000}"
    volumes:
      - whatsapp_media:/var/whatsapp_media:ro
      - ./exports:/exports
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  postgres_data:
  whatsapp_media:
  import_spool:

networks:
  internal:
    driver: bridge
