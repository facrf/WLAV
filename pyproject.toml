[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wlav"
version = "1.0.0"
description = "WhatsApp Local Archive Vault"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "imageio-ffmpeg>=0.6,<1",
  "Pillow>=11.3,<13",
  "uvicorn[standard]>=0.35,<1",
  "SQLAlchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "wa-crypt-tools @ https://github.com/ElDavoo/wa-crypt-tools/archive/354bf5b0d1b4dfff03bf24c70c937c57d25d9782.tar.gz",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
wlav = "ingestor.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "ingestor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
